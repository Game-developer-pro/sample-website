<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="eq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f2c" />
      <stop offset="50%" stop-color="#141c48" />
      <stop offset="100%" stop-color="#1e1548" />
    </linearGradient>

    <!-- Crest Shield Gradient -->
    <linearGradient id="eq-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Shield Inner Glow -->
    <linearGradient id="eq-shield-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>

    <!-- Graduation Cap / Book Accent Gradient -->
    <linearGradient id="eq-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Book Pages Gradient -->
    <linearGradient id="eq-pages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Golden Tassel & Bookmark Accent -->
    <linearGradient id="eq-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="eq-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon Container (Modern Squircle) -->
  <rect width="512" height="512" rx="116" fill="url(#eq-bg)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#eq-shield)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Subtle Radial Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.12" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.1" />

  <!-- Central Shield Crest (Excellence & Academic Armor) -->
  <path d="M 256 88 
           C 350 88 395 116 395 160 
           C 395 285 328 375 256 424 
           C 184 375 117 285 117 160 
           C 117 116 162 88 256 88 Z" 
        fill="url(#eq-shield)" 
        filter="url(#eq-glow)" />

  <path d="M 256 106 
           C 336 106 375 130 375 168 
           C 375 274 316 354 256 398 
           C 196 354 137 274 137 168 
           C 137 130 176 106 256 106 Z" 
        fill="url(#eq-shield-inner)" />

  <!-- Graduation Cap (The Pinnacle of Academic Achievement) -->
  <!-- Mortarboard Diamond Top -->
  <polygon points="256,140 354,180 256,220 158,180" fill="url(#eq-accent)" />
  <!-- Under Skullcap -->
  <path d="M 198 200 L 198 234 C 198 256 314 256 314 234 L 314 200 Z" fill="#1d4ed8" opacity="0.9" />
  <!-- Cap Center Button -->
  <ellipse cx="256" cy="180" rx="9" ry="6" fill="#38bdf8" />
  <!-- Golden Tassel draping to the right -->
  <path d="M 256 180 Q 306 186 338 214 L 344 262" fill="none" stroke="url(#eq-gold)" stroke-width="5" stroke-linecap="round" />
  <circle cx="344" cy="264" r="6" fill="#f59e0b" />

  <!-- Clean Open Book of Knowledge in Shield Center -->
  <!-- Left Page -->
  <path d="M 250 286 
           C 220 274 186 278 160 288 
           L 160 352 
           C 186 342 220 338 250 350 Z" 
        fill="url(#eq-pages)" />
  <!-- Right Page -->
  <path d="M 262 286 
           C 292 274 326 278 352 288 
           L 352 352 
           C 326 342 292 338 262 350 Z" 
        fill="url(#eq-pages)" />

  <!-- Book Spine Center Divider -->
  <line x1="256" y1="284" x2="256" y2="352" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />

  <!-- Stylized Text / Note Lines on Left Page -->
  <line x1="178" y1="305" x2="232" y2="300" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="178" y1="318" x2="232" y2="313" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="178" y1="331" x2="220" y2="326" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Stylized Text / Note Lines on Right Page -->
  <line x1="280" y1="300" x2="334" y2="305" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="280" y1="313" x2="334" y2="318" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="280" y1="326" x2="322" y2="331" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Elegant Golden Ribbon Bookmark Hanging from Book Base -->
  <polygon points="251,350 261,350 261,374 256,369 251,374" fill="url(#eq-gold)" />
</svg>
