<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Glow Pong - Cyber Neon</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --p1-color: #0df;
      --p2-color: #10b981;
      --ball-color: #fbbf24;
      --bg: #050512;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: #fff;
      touch-action: none;
      user-select: none;
      position: relative;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Screen Wrapper: fills 100% of viewport and scales/rotates perfectly on mobile */
    .screen-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      overflow: hidden;
      transform-origin: center center;
    }

    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 300px; height: 300px; background: rgba(0, 221, 255, 0.06); top: -80px; left: -80px; }
    .orb-2 { width: 300px; height: 300px; background: rgba(16, 185, 129, 0.06); bottom: -80px; right: -80px; }

    .top-bar {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    .game-title {
      font-size: clamp(0.95rem, 3vw, 1.3rem);
      font-weight: 900;
      background: linear-gradient(90deg, var(--p1-color), var(--p2-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-select {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 2px;
      gap: 2px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 30px;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, var(--p1-color), #0055ff);
      color: #fff;
      box-shadow: 0 0 12px rgba(0, 221, 255, 0.3);
    }
    .mode-btn.active.ai-expert {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }

    .scoreboard {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 2px 0;
      flex-shrink: 0;
    }

    .score-box {
      text-align: center;
      min-width: 50px;
    }
    .score-label {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1px;
    }
    .p1-label { color: var(--p1-color); }
    .p2-label { color: var(--p2-color); }

    .score-num {
      font-size: clamp(1.4rem, 4.5vw, 2.2rem);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 16px currentColor;
    }
    .p1-score { color: var(--p1-color); }
    .p2-score { color: var(--p2-color); }

    .score-divider {
      font-size: 1.1rem;
      font-weight: 900;
      color: #475569;
    }

    .canvas-container {
      position: relative;
      z-index: 5;
      flex: 1;
      width: 100%;
      max-width: 860px;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
    }

    canvas {
      display: block;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 0 24px rgba(0, 221, 255, 0.05), inset 0 0 20px rgba(0,0,0,0.8);
      background: #060616;
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .game-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 18, 0.92);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 14px;
      text-align: center;
    }
    .game-overlay.hidden { display: none; }

    .overlay-title {
      font-size: clamp(1.3rem, 4.5vw, 2rem);
      font-weight: 900;
      margin-bottom: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .overlay-subtitle {
      color: #94a3b8;
      font-size: 0.8rem;
      margin-bottom: 14px;
      max-width: 280px;
    }

    .serve-banner {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 221, 255, 0.4);
      box-shadow: 0 0 20px rgba(0, 221, 255, 0.25);
      border-radius: 30px;
      padding: 6px 16px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 15;
      pointer-events: none;
      animation: pulseServe 1.2s infinite alternate;
    }
    @keyframes pulseServe {
      0% { transform: translateX(-50%) scale(0.97); opacity: 0.85; }
      100% { transform: translateX(-50%) scale(1.03); opacity: 1; box-shadow: 0 0 25px rgba(0, 221, 255, 0.5); }
    }

    .btn-action {
      background: linear-gradient(135deg, var(--p1-color), #0055ff);
      color: #fff;
      border: none;
      padding: 8px 24px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 16px rgba(0, 221, 255, 0.4);
      transition: all 0.2s;
    }
    .btn-action:hover {
      transform: scale(1.04);
      box-shadow: 0 0 24px rgba(0, 221, 255, 0.6);
    }

    .bottom-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.68rem;
      color: #64748b;
      flex-wrap: wrap;
      text-align: center;
      flex-shrink: 0;
    }
    .kbd-tag {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: monospace;
      color: #cbd5e1;
      font-weight: 700;
    }

    .touch-hints {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      padding: 10px;
      opacity: 0.25;
      font-size: 0.68rem;
      font-weight: 700;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="screen-wrapper" id="screen-wrapper">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="top-bar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <button onclick="exitToArcade()" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #f87171; padding: 4px 10px; border-radius: 20px; font-family: 'Outfit', sans-serif; font-size: 0.72rem; font-weight: 800; cursor: pointer; transition: all 0.2s;">🚪 Exit</button>
        <button id="pause-btn" onclick="handlePauseBtn()" style="background: rgba(0,221,255,0.1); border: 1px solid rgba(0,221,255,0.35); color: #0df; padding: 4px 10px; border-radius: 20px; font-family: 'Outfit', sans-serif; font-size: 0.72rem; font-weight: 800; cursor: pointer; transition: all 0.2s;">⏸ Pause</button>
        <div class="game-title">
          🏓 Glow Pong
        </div>
      </div>
      
      <div class="mode-select">
        <button class="mode-btn active" id="mode-ai-med" onclick="setGameMode('ai-med')">🤖 AI Medium</button>
        <button class="mode-btn" id="mode-ai-hard" onclick="setGameMode('ai-hard')">🔥 AI Expert</button>
        <button class="mode-btn" id="mode-2p" onclick="setGameMode('2p')">👥 2P Local</button>
      </div>
    </div>

    <div class="scoreboard">
      <div class="score-box">
        <div class="score-label p1-label" id="p1-title">Player 1</div>
        <div class="score-num p1-score" id="p1-score">0</div>
      </div>
      <div class="score-divider">:</div>
      <div class="score-box">
        <div class="score-label p2-label" id="p2-title">AI Bot</div>
        <div class="score-num p2-score" id="p2-score">0</div>
      </div>
    </div>

    <div class="canvas-container" id="canvas-container">
      <canvas id="gameCanvas" width="800" height="500"></canvas>

      <div class="serve-banner" id="serve-banner" style="display: none;">
        <span id="serve-banner-text">⚡ Press ↑ / ↓ or W / S to Serve</span>
      </div>

      <div class="touch-hints">
        <span>▲ Drag Left Paddle ▼</span>
        <span id="right-touch-hint">▲ AI Paddle ▼</span>
      </div>

      <div class="game-overlay" id="match-overlay">
        <div class="overlay-title" id="overlay-title">Ready to Play?</div>
        <div class="overlay-subtitle" id="overlay-subtitle">First to 5 points claims victory in the arena!</div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button class="btn-action" id="overlay-btn" onclick="pauseOverlayBtnClick()">Start Match</button>
          <button class="btn-action" onclick="exitToArcade()" style="background: rgba(239,68,68,0.25); border: 1px solid rgba(239,68,68,0.6); box-shadow: 0 0 16px rgba(239,68,68,0.3);">Exit Game</button>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <span>🕹️ Controls: <span class="kbd-tag">W / S</span> or <span class="kbd-tag">↑ / ↓</span> to Move &amp; Serve &bull; <span class="kbd-tag">Space</span> Resume/Pause &bull; 📱 Touch Drag</span>
    </div>
  </div>

  <script>
    function exitToArcade() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage('EXIT_GAME', '*');
      } else {
        window.location.href = '/games';
      }
    }

    const wrapper = document.getElementById('screen-wrapper');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const p2TitleEl = document.getElementById('p2-title');
    const overlay = document.getElementById('match-overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySubtitle = document.getElementById('overlay-subtitle');
    const overlayBtn = document.getElementById('overlay-btn');
    const rightTouchHint = document.getElementById('right-touch-hint');
    const serveBanner = document.getElementById('serve-banner');
    const serveBannerText = document.getElementById('serve-banner-text');

    const WINNING_SCORE = 5;
    let mode = 'ai-med';
    let isPlaying = false;
    let isPaused = false;
    let isServing = false;
    let serverPlayer = 1; // 1 = Player 1, 2 = Player 2 / AI
    let p1Score = 0;
    let p2Score = 0;
    let rallyCount = 0;

    const V_WIDTH = 800;
    const V_HEIGHT = 500;

    const paddleWidth = 14;
    const paddleHeight = 90;

    let isPortraitRotated = false;

    function applyScreenRotation() {
      const winW = window.innerWidth;
      const winH = window.innerHeight;

      if (winW < 768 && winH > winW) {
        isPortraitRotated = true;
        wrapper.style.position = 'absolute';
        wrapper.style.width = winH + 'px';
        wrapper.style.height = winW + 'px';
        wrapper.style.transform = 'rotate(90deg)';
        wrapper.style.top = ((winH - winW) / 2) + 'px';
        wrapper.style.left = ((winW - winH) / 2) + 'px';
      } else {
        isPortraitRotated = false;
        wrapper.style.position = 'relative';
        wrapper.style.width = '100%';
        wrapper.style.height = '100%';
        wrapper.style.transform = 'none';
        wrapper.style.top = '0px';
        wrapper.style.left = '0px';
      }
    }

    window.addEventListener('resize', applyScreenRotation);
    window.addEventListener('orientationchange', applyScreenRotation);
    applyScreenRotation();

    const p1 = {
      x: 30,
      y: V_HEIGHT / 2 - paddleHeight / 2,
      w: paddleWidth,
      h: paddleHeight,
      targetY: null,
      color: '#0df',
      glow: '#0df'
    };

    const p2 = {
      x: V_WIDTH - 30 - paddleWidth,
      y: V_HEIGHT / 2 - paddleHeight / 2,
      w: paddleWidth,
      h: paddleHeight,
      targetY: null,
      color: '#10b981',
      glow: '#10b981'
    };

    const ball = {
      x: V_WIDTH / 2,
      y: V_HEIGHT / 2,
      radius: 8,
      vx: 0,
      vy: 0,
      speed: 7,
      color: '#fbbf24',
      trail: []
    };

    let particles = [];

    const keys = {
      w: false,
      s: false,
      ArrowUp: false,
      ArrowDown: false
    };

    function triggerServe(fromPlayer) {
      if (!isServing || !isPlaying || isPaused) return;

      // In 2P mode, verify correct player or allow either to trigger
      if (fromPlayer !== undefined && mode === '2p') {
        if (serverPlayer === 1 && fromPlayer !== 1) return;
        if (serverPlayer === 2 && fromPlayer !== 2) return;
      }

      isServing = false;
      serveBanner.style.display = 'none';

      // Launch ball away from server's paddle towards opponent
      ball.speed = 7;
      const angle = (Math.random() * 0.8 - 0.4);
      const dir = (serverPlayer === 1) ? 1 : -1;
      ball.vx = Math.cos(angle) * ball.speed * dir;
      ball.vy = Math.sin(angle) * ball.speed;
      createSparks(ball.x, ball.y, serverPlayer === 1 ? p1.color : p2.color, 20);
    }

    window.addEventListener('keydown', (e) => {
      let triggeredServe = false;

      if (e.key === 'w' || e.key === 'W' || e.code === 'KeyW') {
        keys.w = true;
        p1.targetY = null;
        if (isServing && (serverPlayer === 1 || mode !== '2p')) {
          triggerServe(1);
          triggeredServe = true;
        }
        e.preventDefault();
      }
      if (e.key === 's' || e.key === 'S' || e.code === 'KeyS') {
        keys.s = true;
        p1.targetY = null;
        if (isServing && (serverPlayer === 1 || mode !== '2p')) {
          triggerServe(1);
          triggeredServe = true;
        }
        e.preventDefault();
      }
      if (e.key === 'ArrowUp' || e.code === 'ArrowUp') {
        if (mode === '2p') {
          keys.ArrowUp = true;
          p2.targetY = null;
          if (isServing && serverPlayer === 2) {
            triggerServe(2);
            triggeredServe = true;
          }
        } else {
          keys.w = true;
          p1.targetY = null;
          if (isServing) {
            triggerServe(1);
            triggeredServe = true;
          }
        }
        e.preventDefault();
      }
      if (e.key === 'ArrowDown' || e.code === 'ArrowDown') {
        if (mode === '2p') {
          keys.ArrowDown = true;
          p2.targetY = null;
          if (isServing && serverPlayer === 2) {
            triggerServe(2);
            triggeredServe = true;
          }
        } else {
          keys.s = true;
          p1.targetY = null;
          if (isServing) {
            triggerServe(1);
            triggeredServe = true;
          }
        }
        e.preventDefault();
      }
      if (e.code === 'Space') {
        if (isPlaying) {
          if (isServing) {
            triggerServe();
          } else {
            togglePause();
          }
        }
        e.preventDefault();
      }
      if (e.key === 'r' || e.key === 'R') {
        resetMatch();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.code === 'KeyW') keys.w = false;
      if (e.key === 's' || e.key === 'S' || e.code === 'KeyS') keys.s = false;
      if (e.key === 'ArrowUp' || e.code === 'ArrowUp') {
        if (mode === '2p') keys.ArrowUp = false;
        else keys.w = false;
      }
      if (e.key === 'ArrowDown' || e.code === 'ArrowDown') {
        if (mode === '2p') keys.ArrowDown = false;
        else keys.s = false;
      }
    });

    // Touch & Pointer Drag controls with automatic rotation adaptation
    function handleTouch(e) {
      if (!isPlaying || isPaused) return;
      const rect = canvas.getBoundingClientRect();

      for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        let canvasX, canvasY;

        if (isPortraitRotated) {
          canvasX = ((touch.clientY - rect.top) / rect.height) * V_WIDTH;
          canvasY = (1 - ((touch.clientX - rect.left) / rect.width)) * V_HEIGHT;
        } else {
          canvasX = ((touch.clientX - rect.left) / rect.width) * V_WIDTH;
          canvasY = ((touch.clientY - rect.top) / rect.height) * V_HEIGHT;
        }

        if (canvasX < V_WIDTH / 2) {
          p1.targetY = Math.max(0, Math.min(V_HEIGHT - p1.h, canvasY - p1.h / 2));
          if (isServing && (serverPlayer === 1 || mode !== '2p')) {
            triggerServe(1);
          }
        } else if (mode === '2p') {
          p2.targetY = Math.max(0, Math.min(V_HEIGHT - p2.h, canvasY - p2.h / 2));
          if (isServing && serverPlayer === 2) {
            triggerServe(2);
          }
        }
      }
    }

    window.addEventListener('touchstart', handleTouch, { passive: true });
    window.addEventListener('touchmove', (e) => {
      handleTouch(e);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    function setGameMode(newMode) {
      mode = newMode;
      document.getElementById('mode-ai-med').classList.toggle('active', mode === 'ai-med');
      document.getElementById('mode-ai-hard').classList.toggle('active', mode === 'ai-hard');
      document.getElementById('mode-ai-hard').classList.toggle('ai-expert', mode === 'ai-hard');
      document.getElementById('mode-2p').classList.toggle('active', mode === '2p');

      p2TitleEl.innerText = mode === '2p' ? 'Player 2' : (mode === 'ai-hard' ? 'AI Master' : 'AI Bot');
      rightTouchHint.innerText = mode === '2p' ? '▲ Drag Right Paddle ▼' : '▲ AI Paddle ▼';
      
      resetMatch();
    }

    function createSparks(x, y, color, count = 16) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 2 + Math.random() * 2,
          color: color,
          alpha: 1,
          life: 0.94 + Math.random() * 0.04
        });
      }
    }

    // Spawn ball resting on the server's paddle
    function spawnBallOnPaddle(servingPlayer) {
      serverPlayer = servingPlayer;
      isServing = true;
      ball.vx = 0;
      ball.vy = 0;
      ball.speed = 7;
      ball.trail = [];
      rallyCount = 0;

      updateBallAttachedToPaddle();

      // Show banner indicating who serves and prompt control
      if (serverPlayer === 1) {
        serveBannerText.innerHTML = '<span style="color:var(--p1-color)">Player 1 Serve:</span> Press ↑ / ↓, W / S or Drag to Play';
        serveBanner.style.borderColor = 'rgba(0, 221, 255, 0.5)';
      } else {
        if (mode === '2p') {
          serveBannerText.innerHTML = '<span style="color:var(--p2-color)">Player 2 Serve:</span> Press ↑ / ↓ or Drag to Play';
          serveBanner.style.borderColor = 'rgba(16, 185, 129, 0.5)';
        } else {
          // AI serving in 1P mode: Auto serve after slight delay or on user control
          serveBannerText.innerHTML = '<span style="color:var(--p2-color)">AI Serve:</span> Press ↑ / ↓ or W / S to Start';
          serveBanner.style.borderColor = 'rgba(16, 185, 129, 0.5)';
          setTimeout(() => {
            if (isServing && serverPlayer === 2 && isPlaying && !isPaused) {
              triggerServe(2);
            }
          }, 900);
        }
      }
      serveBanner.style.display = 'flex';
    }

    function updateBallAttachedToPaddle() {
      if (!isServing) return;
      if (serverPlayer === 1) {
        ball.x = p1.x + p1.w + ball.radius + 2;
        ball.y = p1.y + p1.h / 2;
      } else {
        ball.x = p2.x - ball.radius - 2;
        ball.y = p2.y + p2.h / 2;
      }
    }

    function startMatch() {
      p1Score = 0;
      p2Score = 0;
      updateScoreboard();
      overlay.classList.add('hidden');
      isPlaying = true;
      isPaused = false;
      // Initial match start: spawn on a randomly chosen player
      const initialServer = Math.random() > 0.5 ? 1 : 2;
      spawnBallOnPaddle(initialServer);
    }

    function handlePauseBtn() {
      if (!isPlaying) return;
      togglePause();
    }

    // pauseOverlayBtnClick: when paused = restart; otherwise = startMatch
    function pauseOverlayBtnClick() {
      if (isPaused) {
        // Clicking the on-screen button while paused RESTARTS the game
        isPaused = false;
        resetMatch();
      } else {
        startMatch();
      }
    }

    function togglePause() {
      if (!isPlaying) return;
      isPaused = !isPaused;
      const pauseBtn = document.getElementById('pause-btn');
      if (isPaused) {
        overlayTitle.innerText = "⏸ Game Paused";
        overlaySubtitle.innerText = "Press Space to resume · Click the button below to restart";
        overlayBtn.innerText = "🔄 Restart Match";
        overlay.classList.remove('hidden');
        serveBanner.style.display = 'none';
        if (pauseBtn) { pauseBtn.innerText = '▶ Resume'; pauseBtn.style.background = 'rgba(16,185,129,0.15)'; pauseBtn.style.borderColor = 'rgba(16,185,129,0.4)'; pauseBtn.style.color = '#10b981'; }
      } else {
        overlay.classList.add('hidden');
        if (isServing) serveBanner.style.display = 'flex';
        if (pauseBtn) { pauseBtn.innerText = '⏸ Pause'; pauseBtn.style.background = 'rgba(0,221,255,0.1)'; pauseBtn.style.borderColor = 'rgba(0,221,255,0.35)'; pauseBtn.style.color = '#0df'; }
      }
    }

    function endGame(winner) {
      isPlaying = false;
      isServing = false;
      serveBanner.style.display = 'none';
      const isP1 = winner === 'p1';
      const winnerName = isP1 ? 'Player 1' : (mode === '2p' ? 'Player 2' : 'AI Bot');
      const winnerColor = isP1 ? '#0df' : '#10b981';

      overlayTitle.innerHTML = '<span style="color:' + winnerColor + '">🏆 ' + winnerName + ' Wins!</span>';
      overlaySubtitle.innerText = 'Final Score: ' + p1Score + ' - ' + p2Score + ' in ' + rallyCount + ' rallies';
      overlayBtn.innerText = "Play Again";
      overlay.classList.remove('hidden');
    }

    function resetMatch() {
      isPlaying = false;
      isServing = false;
      serveBanner.style.display = 'none';
      p1Score = 0;
      p2Score = 0;
      updateScoreboard();
      p1.y = V_HEIGHT / 2 - paddleHeight / 2;
      p2.y = V_HEIGHT / 2 - paddleHeight / 2;
      p1.targetY = null;
      p2.targetY = null;
      ball.x = V_WIDTH / 2;
      ball.y = V_HEIGHT / 2;
      ball.vx = 0;
      ball.vy = 0;
      ball.trail = [];
      particles = [];

      overlayTitle.innerText = "Ready to Play?";
      overlaySubtitle.innerText = 'First to ' + WINNING_SCORE + ' points claims victory!';
      overlayBtn.innerText = "Start Match";
      overlay.classList.remove('hidden');
    }

    function updateScoreboard() {
      p1ScoreEl.innerText = p1Score;
      p2ScoreEl.innerText = p2Score;
    }

    function updateAI() {
      const targetCenter = isServing && serverPlayer === 2 ? (V_HEIGHT / 2) : ball.y;
      const paddleCenter = p2.y + p2.h / 2;
      const diff = targetCenter - paddleCenter;

      if (mode === 'ai-med') {
        if (ball.vx > 0 || isServing) {
          p2.y += Math.sign(diff) * Math.min(Math.abs(diff), 5.5);
        } else {
          const centerDiff = (V_HEIGHT / 2) - (p2.y + p2.h / 2);
          p2.y += Math.sign(centerDiff) * Math.min(Math.abs(centerDiff), 2.5);
        }
      } else if (mode === 'ai-hard') {
        if (ball.vx > 0) {
          const predictedY = ball.y + (ball.vy * 8);
          const expertDiff = predictedY - paddleCenter;
          p2.y += Math.sign(expertDiff) * Math.min(Math.abs(expertDiff), 7.8);
        } else {
          const centerDiff = (V_HEIGHT / 2) - (p2.y + p2.h / 2);
          p2.y += Math.sign(centerDiff) * Math.min(Math.abs(centerDiff), 3.5);
        }
      }
    }

    function update() {
      if (!isPlaying || isPaused) return;

      const currentPaddleSpeed = 10;
      if (keys.w) {
        p1.y -= currentPaddleSpeed;
      }
      if (keys.s) {
        p1.y += currentPaddleSpeed;
      }

      if (p1.targetY !== null && p1.targetY !== undefined) {
        p1.y += (p1.targetY - p1.y) * 0.45;
        if (Math.abs(p1.targetY - p1.y) < 1) {
          p1.y = p1.targetY;
        }
      }

      if (mode === '2p') {
        if (keys.ArrowUp) p2.y -= currentPaddleSpeed;
        if (keys.ArrowDown) p2.y += currentPaddleSpeed;
        if (p2.targetY !== null && p2.targetY !== undefined) {
          p2.y += (p2.targetY - p2.y) * 0.45;
          if (Math.abs(p2.targetY - p2.y) < 1) {
            p2.y = p2.targetY;
          }
        }
      } else {
        updateAI();
      }

      p1.y = Math.max(0, Math.min(V_HEIGHT - p1.h, p1.y));
      p2.y = Math.max(0, Math.min(V_HEIGHT - p2.h, p2.y));

      // While serving, ball remains locked to paddle until released
      if (isServing) {
        updateBallAttachedToPaddle();
        return;
      }

      ball.x += ball.vx;
      ball.y += ball.vy;

      ball.trail.push({ x: ball.x, y: ball.y, alpha: 0.6 });
      if (ball.trail.length > 8) ball.trail.shift();

      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy = -ball.vy;
        createSparks(ball.x, 0, '#0df', 8);
      } else if (ball.y + ball.radius >= V_HEIGHT) {
        ball.y = V_HEIGHT - ball.radius;
        ball.vy = -ball.vy;
        createSparks(ball.x, V_HEIGHT, '#0df', 8);
      }

      // Left paddle collision
      if (
        ball.x - ball.radius <= p1.x + p1.w &&
        ball.x - ball.radius >= p1.x - 4 &&
        ball.y >= p1.y - 6 &&
        ball.y <= p1.y + p1.h + 6 &&
        ball.vx < 0
      ) {
        ball.x = p1.x + p1.w + ball.radius;
        const hitOffset = (ball.y - (p1.y + p1.h / 2)) / (p1.h / 2);
        const maxAngle = Math.PI / 3.2;
        const angle = hitOffset * maxAngle;
        
        ball.speed = Math.min(14, ball.speed + 0.35);
        ball.vx = Math.cos(angle) * ball.speed;
        ball.vy = Math.sin(angle) * ball.speed;
        rallyCount++;
        createSparks(ball.x, ball.y, p1.color, 18);
      }

      // Right paddle collision
      if (
        ball.x + ball.radius >= p2.x &&
        ball.x + ball.radius <= p2.x + p2.w + 4 &&
        ball.y >= p2.y - 6 &&
        ball.y <= p2.y + p2.h + 6 &&
        ball.vx > 0
      ) {
        ball.x = p2.x - ball.radius;
        const hitOffset = (ball.y - (p2.y + p2.h / 2)) / (p2.h / 2);
        const maxAngle = Math.PI / 3.2;
        const angle = hitOffset * maxAngle;

        ball.speed = Math.min(14, ball.speed + 0.35);
        ball.vx = -Math.cos(angle) * ball.speed;
        ball.vy = Math.sin(angle) * ball.speed;
        rallyCount++;
        createSparks(ball.x, ball.y, p2.color, 18);
      }

      // Left boundary breached -> Player 1 lost the ball -> Player 2 scores, respawn on Player 1
      if (ball.x + ball.radius < 0) {
        p2Score++;
        updateScoreboard();
        createSparks(0, ball.y, '#ef4444', 30);
        if (p2Score >= WINNING_SCORE) {
          endGame('p2');
        } else {
          // Respawn on the player who lost the ball (Player 1)
          spawnBallOnPaddle(1);
        }
      }

      // Right boundary breached -> Player 2 lost the ball -> Player 1 scores, respawn on Player 2
      if (ball.x - ball.radius > V_WIDTH) {
        p1Score++;
        updateScoreboard();
        createSparks(V_WIDTH, ball.y, '#10b981', 30);
        if (p1Score >= WINNING_SCORE) {
          endGame('p1');
        } else {
          // Respawn on the player who lost the ball (Player 2)
          spawnBallOnPaddle(2);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha *= p.life;
        if (p.alpha <= 0.05) {
          particles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 40; x < V_WIDTH; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, V_HEIGHT);
        ctx.stroke();
      }
      for (let y = 40; y < V_HEIGHT; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(V_WIDTH, y);
        ctx.stroke();
      }

      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 10]);
      ctx.beginPath();
      ctx.moveTo(V_WIDTH / 2, 10);
      ctx.lineTo(V_WIDTH / 2, V_HEIGHT - 10);
      ctx.stroke();
      ctx.restore();

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (let i = 0; i < ball.trail.length; i++) {
        const t = ball.trail[i];
        ctx.save();
        ctx.globalAlpha = (i + 1) / ball.trail.length * 0.4;
        ctx.fillStyle = ball.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, ball.radius * ((i + 1) / ball.trail.length), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Draw Ball
      ctx.save();
      ctx.shadowBlur = isServing ? 24 : 18;
      ctx.shadowColor = isServing ? (serverPlayer === 1 ? p1.color : p2.color) : ball.color;
      ctx.fillStyle = ball.color;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw Player 1 Paddle
      ctx.save();
      ctx.shadowBlur = 16;
      ctx.shadowColor = p1.glow;
      ctx.fillStyle = p1.color;
      ctx.beginPath();
      ctx.roundRect(p1.x, p1.y, p1.w, p1.h, 6);
      ctx.fill();
      ctx.restore();

      // Draw Player 2 Paddle
      ctx.save();
      ctx.shadowBlur = 16;
      ctx.shadowColor = p2.glow;
      ctx.fillStyle = p2.color;
      ctx.beginPath();
      ctx.roundRect(p2.x, p2.y, p2.w, p2.h, 6);
      ctx.fill();
      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
